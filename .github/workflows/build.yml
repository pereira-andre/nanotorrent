name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
jobs:
  engine-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/TorrentClassic.Tests -c Release
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable executable and licenses
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Open and render the actual Windows interface
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/screenshots -Force | Out-Null
          $destination = (Resolve-Path artifacts/screenshots).Path
          $process = Start-Process artifacts/win-x64/TorrentClassic.exe -ArgumentList @('--smoke-test', $destination) -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'UI smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "UI smoke test failed: $($process.ExitCode)" }
          if (-not (Test-Path artifacts/screenshots/result.txt)) { throw 'UI smoke test did not finish' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-interface
          path: artifacts/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64
          path: |
            artifacts/TorrentClassic-win-x64-portable.zip
            artifacts/TorrentClassic-win-x64-portable.zip.sha256
  portable-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publish portable app and licenses
        run: python3 scripts/publish-desktop.py ${{ matrix.rid }}
      - name: Render packaged macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/screenshots
          'artifacts/${{ matrix.rid }}/TorrentClassic/Torrent Classic.app/Contents/MacOS/TorrentClassic.Desktop' --smoke-test "$PWD/artifacts/screenshots"
          test -f artifacts/screenshots/result.txt
      - name: Render packaged Linux app under X11
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/screenshots
          xvfb-run -a artifacts/${{ matrix.rid }}/TorrentClassic/TorrentClassic.Desktop --native-smoke-test "$PWD/artifacts/screenshots"
          test -f artifacts/screenshots/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-${{ matrix.rid }}
          path: artifacts/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.rid }}
          path: |
            artifacts/TorrentClassic-${{ matrix.rid }}-portable.*
