name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-tests:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/TorrentClassic.Tests -c Release
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable executable and licenses
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Open and render the actual Windows interface
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/screenshots -Force | Out-Null
          $destination = (Resolve-Path artifacts/screenshots).Path
          $process = Start-Process artifacts/win-x64/TorrentClassic.exe -ArgumentList @('--smoke-test', $destination) -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'UI smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "UI smoke test failed: $($process.ExitCode)" }
          if (-not (Test-Path artifacts/screenshots/result.txt)) { throw 'UI smoke test did not finish' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-interface
          path: artifacts/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64
          path: |
            artifacts/TorrentClassic-win-x64-portable.zip
            artifacts/TorrentClassic-win-x64-portable.zip.sha256
